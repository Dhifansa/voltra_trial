name: Bug
description: Laporkan perilaku yang tidak sesuai kontrak atau ekspektasi.
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Ringkasan
      description: Apa yang salah, di layar/alur mana?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi
      placeholder: "1. Buka ...\n2. Pilih ...\n3. Lihat ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Hasil yang diharapkan
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Hasil aktual
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Perangkat/browser
      placeholder: "Android 13, Chrome 130; atau iPhone 12, Safari"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Bukti
      description: Screenshot, log, request_id. Jangan sertakan data pribadi pengguna.
      placeholder: "Tempel screenshot/log yang sudah disensor."

  - type: dropdown
    id: severity
    attributes:
      label: Dampak
      options:
        - P0 — memblokir alur utama/data hilang
        - P1 — alur utama terganggu, ada workaround
        - P2 — kosmetik/edge case
    validations:
      required: true
